<style>
:root {
  --g50: #f0fdf4; --g100: #dcfce7; --g200: #bbf7d0; --g300: #86efac;
  --g400: #4ade80; --g500: #22c55e; --g600: #16a34a; --g700: #15803d;
  --g800: #166534; --g900: #14532d;
  --bg: #f0fdf4; --card: #fff; --text: #1a2e1a; --tl: #6b7280;
  --border: #dcfce7; --shadow: 0 1px 3px rgba(0,0,0,0.05);
  --radius: 12px; --nav-w: 68px;
  --safe-b: env(safe-area-inset-bottom, 10px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);display:flex;min-height:100vh;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
/* 左侧导航 */
nav{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);
  background:linear-gradient(180deg,var(--g800),var(--g900));
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0;z-index:100;gap:3px;
}
nav .logo{
  width:38px;height:38px;background:var(--g400);border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:var(--g900);margin-bottom:10px;flex-shrink:0;
}
nav .nav-items{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0;
}
nav .nav-item{
  width:50px;height:50px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;cursor:pointer;transition:all .15s;color:var(--g300);
  font-size:10px;flex-shrink:0;position:relative;
}
nav .nav-item .ic{font-size:20px;line-height:1}
nav .nav-item.active{background:var(--g700);color:#fff}
nav .nav-item:active{transform:scale(.9)}
nav .nav-add{
  width:40px;height:40px;border-radius:50%;background:var(--g500);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  cursor:pointer;flex-shrink:0;margin-top:auto;transition:all .15s;
}
nav .nav-add:active{transform:scale(.88);background:var(--g400)}
/* 主区域 */
main{
  margin-left:var(--nav-w);flex:1;padding:14px;
  padding-bottom:calc(76px + var(--safe-b));max-width:500px;width:100%;
}
/* 顶部 */
.header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.header .greeting{font-size:17px;font-weight:700}
.header .score-badge{
  background:var(--g500);color:#fff;padding:5px 12px;border-radius:18px;
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px;
}
/* 分类标题 */
.sec-tit{
  font-size:13px;font-weight:700;color:var(--g700);margin:14px 0 7px;
  display:flex;align-items:center;gap:5px;
}
.sec-tit::before{content:'';width:3px;height:14px;background:var(--g500);border-radius:2px}
/* 任务卡片 */
.task-card{
  background:var(--card);border-radius:var(--radius);padding:11px 12px;
  margin-bottom:6px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;transition:all .15s;
  border:1.5px solid transparent;
}
.task-card.done{background:var(--g50);border-color:var(--g200);opacity:.75}
.task-card .check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--g300);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;transition:all .15s;font-size:13px;color:transparent;
}
.task-card.done .check{background:var(--g500);border-color:var(--g500);color:#fff}
.task-card .task-info{flex:1;min-width:0}
.task-card .task-name{font-size:13px;font-weight:600}
.task-card.done .task-name{text-decoration:line-through;color:var(--tl)}
.task-card .task-meta{font-size:10px;color:var(--tl);margin-top:1px}
.task-card .task-pts{
  font-size:10px;font-weight:600;color:var(--g600);background:var(--g100);
  padding:2px 7px;border-radius:9px;white-space:nowrap;flex-shrink:0;
}
.task-card .task-del{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#ef4444;cursor:pointer;flex-shrink:0;
  opacity:0;transition:all .15s;
}
.task-card:active .task-del{opacity:1}
/* 奖励卡片 */
.reward-card{
  background:var(--card);border-radius:var(--radius);padding:11px 12px;
  margin-bottom:6px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s;
  border:1.5px solid transparent;
}
.reward-card:active{transform:scale(.97)}
.reward-card.affordable{border-color:var(--g300)}
.reward-card.locked{opacity:.45}
.reward-card .r-icon{font-size:26px;flex-shrink:0}
.reward-card .r-info{flex:1}
.reward-card .r-name{font-size:13px;font-weight:600}
.reward-card .r-cost{font-size:11px;color:var(--g600);font-weight:600}
.reward-card .r-btn{
  padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;
  border:none;cursor:pointer;transition:all .15s;flex-shrink:0;
}
.reward-card .r-btn.can{background:var(--g500);color:#fff}
.reward-card .r-btn.cant{background:#e5e7eb;color:#9ca3af}

function initState(){
  const cats={};
  defaultCategories.forEach(dc=>{cats[dc.id]={tasks:dc.tasks.map(t=>({...t,id:t.id||genId()}))};});
  return{
    categories:cats,completed:{},totalScore:0,
    today:getToday(),poemIndex:0,scienceIndex:0,essayIndex:0,
  };
}

function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function genId(){return 't'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}

function ensureToday(){
  if(state.today!==getToday()){
    state.today=getToday();
    state.poemIndex=(state.poemIndex+1)%poems.length;
    state.scienceIndex=(state.scienceIndex+1)%scienceFacts.length;
    // 每周一更换作文题目
    const d=new Date();
    if(d.getDay()===1) state.essayIndex=(state.essayIndex+1)%essayTopics.length;
    saveState();
  }
}

function getTodayCompleted(){return state.completed[state.today]||{}}

function toggleTask(taskId){
  ensureToday();
  if(!state.completed[state.today])state.completed[state.today]={};
  const wasDone=state.completed[state.today][taskId];
  if(wasDone){
    delete state.completed[state.today][taskId];
    let pts=10;
    for(const cat of Object.values(state.categories)){
      const t=cat.tasks.find(t=>t.id===taskId);
      if(t){pts=t.pts||10;break;}
    }
    state.totalScore=Math.max(0,(state.totalScore||0)-pts);
  }else{
    state.completed[state.today][taskId]=true;
    let pts=10;
    for(const cat of Object.values(state.categories)){
      const t=cat.tasks.find(t=>t.id===taskId);
      if(t){pts=t.pts||10;break;}
    }
    state.totalScore=(state.totalScore||0)+pts;
  }
  saveState();render();
  if(!wasDone)showToast('✅ 打卡成功！+'+getTaskPts(taskId)+'积分');
}

function getTaskPts(taskId){
  for(const cat of Object.values(state.categories)){
    const t=cat.tasks.find(t=>t.id===taskId);
    if(t)return t.pts||10;
  }
  return 10;
}

function deleteTask(taskId){
  for(const catId of Object.keys(state.categories)){
    state.categories[catId].tasks=state.categories[catId].tasks.filter(t=>t.id!==taskId);
  }
  saveState();render();showToast('🗑️ 任务已删除');
}

function addTask(){
  const name=document.getElementById('addName').value.trim();
  const category=document.getElementById('addCategory').value;
  const pts=parseInt(document.getElementById('addPoints').value)||10;
  if(!name){showToast('请输入任务名称');return;}
  if(!state.categories[category])state.categories[category]={tasks:[]};
  state.categories[category].tasks.push({id:genId(),name,pts,type:'daily'});
  saveState();closeAddModal();switchNav(category);render();showToast('✅ 任务已添加');
}

function redeemReward(rewardId){
  const reward=rewards.find(r=>r.id===rewardId);
  if(!reward)return;
  if((state.totalScore||0)<reward.cost){showToast('😅 积分不足，继续加油！');return;}
  state.totalScore-=reward.cost;
  saveState();render();showToast('🎉 兑换成功：'+reward.name+'！');
}

// ============ 渲染 ============
function render(){ensureToday();renderNav();renderContent();renderBottomBar();}

function renderNav(){
  const container=document.getElementById('navItems');
  container.innerHTML=Object.entries(state.categories).map(([id])=>{
    const dc=defaultCategories.find(d=>d.id===id);
    const icon=dc?dc.icon:'📋';const name=dc?dc.name:id;
    return `<div class="nav-item ${currentNav===id?'active':''}" onclick="switchNav('${id}')"><span class="ic">${icon}</span>${name}</div>`;
  }).join('');
}

function switchNav(id){currentNav=id;render();}

function renderContent(){
  const main=document.getElementById('mainContent');
  const completed=getTodayCompleted();
  if(currentNav==='fun'){main.innerHTML=renderGames();return;}
  if(currentNav==='rewards'){main.innerHTML=renderRewards();return;}
  main.innerHTML=renderTaskSection(currentNav,completed);
}

function renderHeader(){
  const d=new Date();
  const weekDays=['日','一','二','三','四','五','六'];
  const dateStr=`${d.getMonth()+1}月${d.getDate()}日 星期${weekDays[d.getDay()]}`;
  return `<div class="header"><div><div class="greeting">🌞 暑假工作台</div><div style="font-size:11px;color:var(--tl)">${dateStr}</div></div><div class="score-badge"><span>⭐</span> ${state.totalScore||0}分</div></div>`;
}

function renderTaskSection(catId,completed){
  const cat=state.categories[catId];
  const dc=defaultCategories.find(d=>d.id===catId);
  const catName=dc?dc.name:catId;const catIcon=dc?dc.icon:'📋';
  let html=renderHeader();

  // 语文：显示古诗 + 作文
  if(catId==='chinese'){
    const poem=poems[state.poemIndex%poems.length];
    html+=`<div class="poem-box"><div class="pt">📜 ${poem.title}</div><div class="pa">—— ${poem.author}</div><div class="pl">${poem.lines.replace(/\n/g,'<br>')}</div><div style="font-size:10px;color:var(--tl);margin-top:6px">📅 今日背诵古诗</div></div>`;
    const essay=essayTopics[state.essayIndex%essayTopics.length];
    html+=`<div class="essay-box"><div class="et">✏️ 本周作文</div><div class="ed">${essay}</div></div>`;
  }

  // 科学：显示科普
  if(catId==='science'){
    const fact=scienceFacts[state.scienceIndex%scienceFacts.length];
    html+=`<div class="poem-box" style="text-align:left"><div style="font-size:13px;line-height:1.7">${fact}</div></div>`;
  }

  html+=`<div class="sec-tit">${catIcon} ${catName} · 每日任务</div>`;
  const tasks=cat.tasks||[];
  if(tasks.length===0){
    html+=`<div style="text-align:center;padding:28px;color:var(--tl)">暂无任务，点击左下角 + 添加</div>`;
  }else{
    tasks.forEach(t=>{
      const done=!!completed[t.id];
      const meta=t.type==='weekly'?'每周任务':'每日任务';
      html+=`<div class="task-card ${done?'done':''}" onclick="toggleTask('${t.id}')"><div class="check">✓</div><div class="task-info"><div class="task-name">${t.name}</div><div class="task-meta">${meta}</div></div><div class="task-pts">+${t.pts||10}分</div><div class="task-del" onclick="event.stopPropagation();deleteTask('${t.id}')">✕</div></div>`;
    });
  }
  return html;
}

function renderGames(){
  let html=renderHeader();
  html+=`<div class="sec-tit">🎮 娱乐小游戏</div>`;
  html+=`<div class="game-card" onclick="startChineseGame()"><div class="g-icon cn">📖</div><div class="g-info"><div class="g-name">语文 · 古诗填空</div><div class="g-desc">根据上下文填写古诗空缺的字词</div></div></div>`;
  html+=`<div class="game-card" onclick="startMathGame()"><div class="g-icon ma">🔢</div><div class="g-info"><div class="g-name">数学 · 速算挑战</div><div class="g-desc">加减乘除混合运算，看看你能对几题</div></div></div>`;
  html+=`<div class="game-card" onclick="startScienceGame()"><div class="g-icon sc">🔬</div><div class="g-info"><div class="g-name">科学 · 知识问答</div><div class="g-desc">趣味科学知识选择题</div></div></div>`;
  html+=`<div class="game-card" onclick="startEnglishGame()"><div class="g-icon en">🦆</div><div class="g-info"><div class="g-name">英语 · 抓大鹅</div><div class="g-desc">找到单词与实物对应的卡片配对消除</div></div></div>`;
  html+=`<div style="text-align:center;padding:14px;font-size:11px;color:var(--tl)">⚠️ 娱乐游戏不计入积分</div>`;
  return html;
}

function renderRewards(){
  let html=renderHeader();
  html+=`<div class="sec-tit">🎁 积分兑换奖励</div>`;
  html+=`<div style="text-align:center;margin:6px 0;font-size:12px;color:var(--tl)">当前积分：<b style="color:var(--g600);font-size:17px">${state.totalScore||0}</b></div>`;
  rewards.forEach(r=>{
    const canBuy=(state.totalScore||0)>=r.cost;
    html+=`<div class="reward-card ${canBuy?'affordable':'locked'}"><div class="r-icon">${r.icon}</div><div class="r-info"><div class="r-name">${r.name}</div><div class="r-cost">需要 ${r.cost} 积分</div></div><button class="r-btn ${canBuy?'can':'cant'}" onclick="event.stopPropagation();redeemReward('${r.id}')">${canBuy?'兑换':'不足'}</button></div>`;
  });
  return html;
}

function renderBottomBar(){
  const completed=getTodayCompleted();
  let doneCount=0,totalCount=0;
  for(const cat of Object.values(state.categories)){
    (cat.tasks||[]).forEach(t=>{totalCount++;if(completed[t.id])doneCount++;});
  }
  document.getElementById('statDone').textContent=doneCount;
  document.getElementById('statTotal').textContent=totalCount;
  document.getElementById('statScore').textContent=state.totalScore||0;
  let streak=0;const d=new Date();
  for(let i=0;i<365;i++){
    const ds=d.toISOString().split('T')[0];
    const comp=state.completed[ds];
    if(comp&&Object.keys(comp).length>0){streak++;d.setDate(d.getDate()-1);}
    else if(i===0){d.setDate(d.getDate()-1);}else break;
  }
  document.getElementById('statStreak').textContent=streak;
}

// ============ 游戏 ============
let gameState={};

  {q:'一行白鹭上___天',a:'青',opts:['青','蓝','晴','碧']},
  {q:'远上寒山石径___',a:'斜',opts:['斜','直','弯','窄']},
  {q:'霜叶红于___月花',a:'二',opts:['二','三','四','五']},
  {q:'春___水暖鸭先知',a:'江',opts:['江','河','湖','海']},

const scienceQuiz=[

  {q:'太阳光到达地球需要多长时间？',a:'约8分钟',opts:['约8分钟','约1秒','约1小时','约1天']},
  {q:'章鱼有几颗心脏？',a:'3颗',opts:['3颗','1颗','2颗','4颗']},
  {q:'鲨鱼一生可换掉约多少颗牙齿？',a:'3万颗',opts:['3万颗','30颗','300颗','3000颗']},
  {q:'月球每年以多少速度远离地球？',a:'约3.8厘米',opts:['约3.8厘米','约1米','约1公里','约10米']},
  {q:'蝴蝶用什么部位来品尝味道？',a:'脚',opts:['脚','嘴巴','翅膀','触角']},
  {q:'蚂蚁能举起自身体重多少倍的物体？',a:'50倍',opts:['50倍','5倍','10倍','100倍']},
  {q:'海豚睡觉时是怎样的？',a:'一半大脑休息',opts:['一半大脑休息','完全不睡','沉入海底','浮在水面']},
  {q:'竹子一天能长多高？',a:'约1米',opts:['约1米','约10厘米','约5米','约1厘米']},
  {q:'冰山露出水面的部分占多少？',a:'约10%',opts:['约10%','约50%','约90%','约30%']},
];

function startChineseGame(){
  gameState={score:0,qi:0,questions:shuffle([...poemQuiz]).slice(0,8)};
  showChineseQ();
}
function showChineseQ(){
  const gs=gameState;
  if(gs.qi>=gs.questions.length){
    showGameEnd('📖 古诗填空',gs.score,gs.questions.length,gs.score>=6?'太棒了！古诗小达人！':gs.score>=4?'不错哦，继续加油！':'多背背古诗，下次更厉害！',startChineseGame);
    return;
  }
  const q=gs.questions[gs.qi];
  document.getElementById('gameBox').innerHTML=`<h3>📖 古诗填空</h3><div class="gm-score">第${gs.qi+1}/${gs.questions.length}题 · 得分：${gs.score}</div><div class="question">${q.q}</div><div class="options">${shuffle([...q.opts]).map(o=>`<div class="option" onclick="answerCQ('${o}')">${o}</div>`).join('')}</div>`;
  document.getElementById('gameModal').style.display='flex';
}
function answerCQ(choice){
  const q=gameState.questions[gameState.qi];
  document.querySelectorAll('#gameBox .option').forEach(o=>{o.style.pointerEvents='none';if(o.textContent===q.a)o.classList.add('correct');if(o.textContent===choice&&choice!==q.a)o.classList.add('wrong');});
  if(choice===q.a)gameState.score++;
  gameState.qi++;setTimeout(showChineseQ,700);
}

function startMathGame(){
  gameState={score:0,qi:0,total:10};
  showMathQ();
}
function showMathQ(){
  const gs=gameState;
  if(gs.qi>=gs.total){
    showGameEnd('🔢 速算挑战',gs.score,gs.total,gs.score>=8?'数学小天才！':gs.score>=5?'继续加油！':'多做练习会更好！',startMathGame);
    return;
  }
  const ops=[()=>{const a=r(10,99),b=r(10,99);return{q:`${a} + ${b} = ?`,a:a+b};},()=>{const a=r(20,99),b=r(10,a);return{q:`${a} - ${b} = ?`,a:a-b};},()=>{const a=r(2,12),b=r(2,9);return{q:`${a} × ${b} = ?`,a:a*b};},()=>{const b=r(2,9);const a=b*r(2,12);return{q:`${a} ÷ ${b} = ?`,a:a/b};}];
  const p=ops[r(0,3)]();gs._ans=p.a;
  const wrongs=new Set([p.a]);
  while(wrongs.size<4){const w=p.a+r(-15,15);if(w>0&&w!==p.a)wrongs.add(w);}
  document.getElementById('gameBox').innerHTML=`<h3>🔢 速算挑战</h3><div class="gm-score">第${gs.qi+1}/${gs.total}题 · 得分：${gs.score}</div><div class="question">${p.q}</div><div class="options">${shuffle([...wrongs]).map(o=>`<div class="option" onclick="answerMQ(${o})">${o}</div>`).join('')}</div>`;
  document.getElementById('gameModal').style.display='flex';
}
function answerMQ(choice){
  const correct=gameState._ans;
  document.querySelectorAll('#gameBox .option').forEach(o=>{o.style.pointerEvents='none';if(parseInt(o.textContent)===correct)o.classList.add('correct');if(parseInt(o.textContent)===choice&&choice!==correct)o.classList.add('wrong');});
  if(choice===correct)gameState.score++;
  gameState.qi++;setTimeout(showMathQ,700);
}

function startScienceGame(){
  gameState={score:0,qi:0,questions:shuffle([...scienceQuiz]).slice(0,8)};
  showScienceQ();
}
function showScienceQ(){
  const gs=gameState;
  if(gs.qi>=gs.questions.length){
    showGameEnd('🔬 科学问答',gs.score,gs.questions.length,gs.score>=6?'科学小博士！':gs.score>=4?'不错哦！':'继续探索科学世界！',startScienceGame);
    return;
  }
  const q=gs.questions[gs.qi];
  document.getElementById('gameBox').innerHTML=`<h3>🔬 科学问答</h3><div class="gm-score">第${gs.qi+1}/${gs.questions.length}题 · 得分：${gs.score}</div><div class="question">${q.q}</div><div class="options">${shuffle([...q.opts]).map(o=>`<div class="option" onclick="answerSQ('${o}')">${o}</div>`).join('')}</div>`;
  document.getElementById('gameModal').style.display='flex';
}
function answerSQ(choice){
  const q=gameState.questions[gameState.qi];
  document.querySelectorAll('#gameBox .option').forEach(o=>{o.style.pointerEvents='none';if(o.textContent===q.a)o.classList.add('correct');if(o.textContent===choice&&choice!==q.a)o.classList.add('wrong');});
  if(choice===q.a)gameState.score++;
  gameState.qi++;setTimeout(showScienceQ,700);
}

function showGameEnd(title,score,total,msg,restartFn){
  const emoji=score>=total*.75?'🎉':score>=total*.5?'👍':'💪';
  document.getElementById('gameBox').innerHTML=`<h3>${title}</h3><div class="gm-score">得分：${score} / ${total}</div><div style="text-align:center;font-size:42px;margin:16px">${emoji}</div><div style="text-align:center;font-size:13px;color:var(--tl)">${msg}</div><button class="gm-close" onclick="closeGame()">关闭</button><button class="gm-close" style="margin-left:6px;background:var(--g700)" onclick="${restartFn.name}()">再来一局</button>`;
  document.getElementById('gameModal').style.display='flex';
}

// 抓大鹅
function startEnglishGame(){
  const pairs=shuffle([...englishWords]).slice(0,6);
  const cards=[];
  pairs.forEach(p=>{cards.push({type:'en',text:p.en,pid:p.en,emoji:''});cards.push({type:'zh',text:p.zh,pid:p.en,emoji:p.emoji});});
  gameState={score:0,total:pairs.length,matched:0,cards:shuffle(cards),sel:null,mids:new Set()};
  showGoose();
}
function showGoose(){
  const gs=gameState;
  const unmatched=gs.cards.filter(c=>!gs.mids.has(c.pid+c.type));
  const target=unmatched.length>0?unmatched[r(0,unmatched.length-1)]:null;
  let html=`<h3>🦆 抓大鹅 · 单词配对</h3><div class="gm-score">已配对：${gs.matched} / ${gs.total}</div>`;
  if(target)html+=`<div class="goose-target">👆 请找到：<span class="tw">${target.type==='en'?target.text:target.emoji+' '+target.text}</span></div>`;
  html+=`<div class="goose-area">`;
  gs.cards.forEach((c,i)=>{
    const m=gs.mids.has(c.pid+c.type),s=gs.sel===i;
    let cls='goose-card';if(m)cls+=' matched';if(s)cls+=' selected';
    const d=c.type==='en'?c.text:(c.emoji||c.text);
    html+=`<div class="${cls}" onclick="selGoose(${i})" style="${m?'visibility:hidden':''}">${d}</div>`;
  });
  html+=`</div><button class="gm-close" onclick="closeGame()">关闭</button>`;
  if(gs.matched>=gs.total){
    html=`<h3>🦆 抓大鹅</h3><div style="text-align:center;font-size:44px;margin:16px">🎉</div><div style="text-align:center;font-size:15px;font-weight:700;color:var(--g600)">全部配对成功！单词小达人！</div><button class="gm-close" onclick="closeGame()">关闭</button><button class="gm-close" style="margin-left:6px;background:var(--g700)" onclick="startEnglishGame()">再来一局</button>`;
  }
  document.getElementById('gameBox').innerHTML=html;
  document.getElementById('gameModal').style.display='flex';
}
function selGoose(i){
  const gs=gameState,c=gs.cards[i];
  if(gs.mids.has(c.pid+c.type))return;
  if(gs.sel===null){gs.sel=i;showGoose();return;}
  const prev=gs.cards[gs.sel];
  if(gs.sel===i){gs.sel=null;showGoose();return;}
  if(prev.pid===c.pid&&prev.type!==c.type){
    gs.mids.add(prev.pid+prev.type);gs.mids.add(c.pid+c.type);gs.matched++;gs.sel=null;showGoose();
  }else{
    const ps=gs.sel;gs.sel=null;showGoose();
    setTimeout(()=>{
      const cards=document.querySelectorAll('.goose-card');
      if(cards[ps])cards[ps].style.background='#fef2f2';
      if(cards[i])cards[i].style.background='#fef2f2';
      setTimeout(()=>{if(cards[ps])cards[ps].style.background='';if(cards[i])cards[i].style.background='';},350);
    },80);
  }
}

function closeGame(){document.getElementById('gameModal').style.display='none';gameState={};}

// ============ 弹窗 ============
function showAddModal(){
  document.getElementById('addName').value='';
  document.getElementById('addPoints').value='10';
  const sel=document.getElementById('addCategory');
  sel.innerHTML=Object.entries(state.categories).map(([id])=>{
    const dc=defaultCategories.find(d=>d.id===id);
    return `<option value="${id}">${dc?dc.icon+' '+dc.name:id}</option>`;
  }).join('');
  sel.value=currentNav;
  document.getElementById('addModal').style.display='flex';
}
function closeAddModal(){document.getElementById('addModal').style.display='none';}
document.addEventListener('click',function(e){
  if(e.target.id==='addModal')closeAddModal();
  if(e.target.id==='gameModal')closeGame();
});

// ============ 工具 ============
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function r(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function showToast(msg){
  const container=document.getElementById('toastContainer');
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  container.appendChild(el);setTimeout(()=>el.remove(),2000);
}

// ============ 初始化 ============
(function init(){
  ensureToday();
  if(state.poemIndex===undefined){state.poemIndex=new Date().getDate()%poems.length;saveState();}
  if(state.essayIndex===undefined){state.essayIndex=new Date().getDate()%essayTopics.length;saveState();}
  render();
})();
</script>
